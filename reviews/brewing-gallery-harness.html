<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brewing illustration QA</title><style>body{font:16px/1.4 system-ui;margin:20px}iframe{display:block;border:1px solid #777;height:1000px;max-width:none;margin:20px 0}pre{white-space:pre-wrap;max-height:180px;overflow:auto}button,select{font:inherit;padding:6px}#stage{overflow:auto}</style><h1>Brewing illustrations: full-page QA</h1><p>Local only. Frames load the complete rendered Tea labels page.</p><button id="run">Run checks</button> <label>Language <select id="locale"><option>en</option><option>zh-hant-hk</option><option>zh-hans</option></select></label> <label>Width <select id="width"><option>1440</option><option>768</option><option>520</option><option>390</option><option>320</option></select></label> <label><input type="checkbox" id="scripts" checked>Enable scripts in frame</label> <button id="show">Show page</button><pre id="result">Not run</pre><div id="stage"></div><script>
const stage=document.querySelector('#stage'),output=document.querySelector('#result');let results=[];
const fragments={en:'thin-strip-teapots-and-brewing-methods','zh-hant-hk':'薄帶茶壺與沖泡方法','zh-hans':'薄带茶壶与冲泡方法'};
function openFrame(locale,width,scripts){return new Promise(resolve=>{stage.replaceChildren();const f=document.createElement('iframe');f.title='Tea labels illustration review';f.style.width=width+'px';f.sandbox=scripts?'allow-scripts allow-same-origin':'allow-same-origin';f.onload=()=>{const d=f.contentDocument;d.querySelector('.tea-brewing-gallery').scrollIntoView();resolve(f)};f.src=(locale==='en'?'':locale+'/')+'tea-labels.html#'+encodeURIComponent(fragments[locale]);stage.append(f);});}
async function inspect(locale,width,scripts){
 const f=await openFrame(locale,width,scripts),d=f.contentDocument,w=f.contentWindow,g=d.querySelector('.tea-brewing-gallery');
 const images=[...g.querySelectorAll('img')];await Promise.all(images.map(im=>{im.loading='eager';return im.decode()}));
 const initiallyOpen=g.open,expandedHeight=g.getBoundingClientRect().height,summary=g.querySelector('summary');summary.click();const closed=!g.open&&g.getBoundingClientRect().height<expandedHeight;summary.click();const reopened=g.open;
 for(let i=0;i<3;i++){summary.click();summary.click();}
 const r={locale,width,scripts,cards:images.length,columns:w.getComputedStyle(g.querySelector('ul')).gridTemplateColumns.split(' ').length,documentOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth+1,galleryOverflow:g.scrollWidth>g.clientWidth+1,captionOverflow:[...g.querySelectorAll('figcaption')].some(e=>e.scrollWidth>e.clientWidth+1),imagesOK:images.every(im=>im.complete&&im.naturalWidth===360&&im.naturalHeight===200&&im.alt.trim()),initiallyOpen,closed,reopened,repeatedToggle:g.open,tables:d.querySelectorAll('table').length,teaNameCards:d.querySelectorAll('[data-tea-name]').length,classificationCards:d.querySelectorAll('[data-tea-classification-card]').length,detective:scripts?!!d.querySelector('.tea-lab-detective'):!!d.querySelector('[data-tea-detective] p'),duplicateIds:[...d.querySelectorAll('[id]')].map(e=>e.id).filter((id,i,a)=>a.indexOf(id)!==i)};
 r.pass=r.cards===6&&r.columns===(width<480?1:width<768?2:3)&&!r.documentOverflow&&!r.galleryOverflow&&!r.captionOverflow&&r.imagesOK&&r.initiallyOpen&&r.closed&&r.reopened&&r.repeatedToggle&&r.tables===8&&r.teaNameCards===28&&r.classificationCards===14&&r.detective&&!r.duplicateIds.length;
 results.push(r);output.textContent=JSON.stringify({running:true,results},null,2);return r;
}
document.querySelector('#run').onclick=async()=>{results=[];try{for(const locale of ['en','zh-hant-hk','zh-hans'])for(const scripts of [true,false])for(const width of [320,390,520,768,1440])await inspect(locale,width,scripts);output.textContent=JSON.stringify({passed:results.every(r=>r.pass),cases:results.length,results},null,2)}catch(e){output.textContent=JSON.stringify({error:String(e),results},null,2)}};
document.querySelector('#show').onclick=async()=>{await openFrame(document.querySelector('#locale').value,+document.querySelector('#width').value,document.querySelector('#scripts').checked)};
</script></html>
